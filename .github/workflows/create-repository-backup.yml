name: Create Repository Backup

on:
  push:
    branches: [main]

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ZIP
        run: |
          git archive --format=zip --output=comfyui-pwa-current-backup.zip HEAD

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-pwa-current-backup
          path: comfyui-pwa-current-backup.zip
          retention-days: 90
